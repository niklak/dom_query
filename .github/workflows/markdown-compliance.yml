name: Markdown Serialization Compliance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  test-markdown-compliance:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Markdown spec fixtures
        uses: actions/cache@v4
        with:
          path: test-md-fixtures
          key: md-fixtures-${{ hashFiles('tests/md-roundtrip.rs') }}

      - name: Run markdown compliance test
        run: cargo nextest run --test md-roundtrip